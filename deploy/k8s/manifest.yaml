apiVersion: v1
kind: Namespace
metadata:
  name: webroon
  labels:
    app.kubernetes.io/name: webroon
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webroon-data
  namespace: webroon
  labels:
    app.kubernetes.io/name: webroon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webroon
  namespace: webroon
  labels:
    app.kubernetes.io/name: webroon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: webroon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webroon
    spec:
      # hostNetwork is required so SOOD UDP multicast/broadcast discovery (239.255.90.90:9003)
      # can reach the Roon Core on the local LAN subnet.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: webroon
          image: ghcr.io/maeck70/webroon:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: ROON_STATE_FILE
              value: "/data/roonstate.json"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: sood-udp
              containerPort: 9003
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /ui/status-badge
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ui/status-badge
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: webroon-data
---
apiVersion: v1
kind: Service
metadata:
  name: webroon
  namespace: webroon
  labels:
    app.kubernetes.io/name: webroon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webroon
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
