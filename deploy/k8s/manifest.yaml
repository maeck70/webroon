apiVersion: v1
kind: Namespace
metadata:
  name: webroon
  labels:
    app.kubernetes.io/name: webroon
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webroon-data
  namespace: webroon
  labels:
    app.kubernetes.io/name: webroon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webroon
  namespace: webroon
  labels:
    app.kubernetes.io/name: webroon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: webroon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webroon
    spec:
      # hostNetwork is required so SOOD UDP multicast/broadcast discovery (239.255.90.90:9003)
      # can reach the Roon Core on the local LAN subnet (192.168.10.10).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: webroon
          image: jombieparty.azurecr.io/webroon:v3
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8088"
            - name: ROON_STATE_FILE
              value: "/data/roonstate.json"
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ui/status-badge
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ui/status-badge
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: webroon-data
---
apiVersion: v1
kind: Service
metadata:
  name: webroon
  namespace: webroon
  labels:
    app.kubernetes.io/name: webroon
  annotations:
    metallb.universe.tf/allow-shared-ip: "shared-vip-180"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.10
  selector:
    app.kubernetes.io/name: webroon
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webroon-ingress
  namespace: webroon
  labels:
    app.kubernetes.io/name: webroon
spec:
  rules:
    - host: roon.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webroon
                port:
                  number: 80
